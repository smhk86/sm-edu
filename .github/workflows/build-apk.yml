name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Build the APK without running the tests (manual runs only)'
        type: boolean
        default: false

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-fra tesseract-ocr-eng

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run the full test suite
        run: npm test

  apk:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_tests)) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install
      - name: Native text-to-speech plugin (optional; never blocks the build)
        run: npm install --no-save @capacitor-community/text-to-speech@^6.0.0 || echo "TTS plugin not installed; the app falls back to the WebView voice"

      - name: Add Android platform
        run: npx cap add android

      - name: Allow microphone (voice dictation)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' "$M"
          grep -c RECORD_AUDIO "$M"

      - name: Speech recognition visibility (Android 11+)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RecognitionService "$M" || sed -i 's#</manifest>#    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>#' "$M"
          grep -c RecognitionService "$M"
          grep -q TTS_SERVICE "$M" || sed -i 's#</queries>#<intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>#' "$M"
          grep -c TTS_SERVICE "$M"

      - name: Set Android version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS=. read -r MA MI PA <<< "$VERSION"
          RUN=$GITHUB_RUN_NUMBER; [ "$RUN" -gt 9999 ] && RUN=9999
          CODE=$(( (MA*10000 + MI*100 + PA) * 10000 + RUN ))
          [ "$CODE" -lt 2100000000 ] || { echo "versionCode too large: $CODE"; exit 1; }
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$GRADLE"
          grep -nE "versionCode|versionName" "$GRADLE"

      - name: Generate app icons (Android)
        run: npx --yes @capacitor/assets generate --android --assetPath assets

      - name: Build the tutor knowledge base (optional; never blocks the build)
        continue-on-error: true
        run: |
          pip install pypdf
          python3 tools/build_tutor_kb.py --limit 300

      - name: Bundle web scripts (fewer files, faster start; falls back to the plain files on any problem)
        run: node tools/bundle_web.js

      - name: Keep the APK small (papers, lessons and curated repository files are downloaded from the content server)
        run: rm -rf web/exams web/repository

      - name: Sync web assets
        run: npx cap sync android

      - name: Use fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::KEYSTORE_B64 غير مضبوط: سيُبنى APK بمفتاح عشوائي ولن يتحدّث فوق النسخة المثبتة. شغّل termux-make-keystore.sh مرة واحدة."
            echo "KEYSTORE_B64 secret not set: building with the default debug key (the APK will not update over a build signed with the fixed key)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/smedu.keystore"
          python3 - <<'PY'
          import os,re
          p='android/app/build.gradle'
          g=open(p).read()
          if 'smeduSigning' not in g:
              cfg = """
              signingConfigs {
                  smeduSigning {
                      storeFile file(System.getenv('RUNNER_TEMP') + '/smedu.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              """
              g=re.sub(r'(android\s*\{)', r'\1' + cfg, g, count=1)
              g=re.sub(r'(buildTypes\s*\{)', r'\1\n        debug { signingConfig signingConfigs.smeduSigning }', g, count=1)
              open(p,'w').write(g)
          PY

      - name: Build debug APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SM_EDUCATION-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a GitHub Release (feeds the in-app update notice)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "SM_EDUCATION-v$VERSION.apk"
          gh release create "v$VERSION-b$GITHUB_RUN_NUMBER" "SM_EDUCATION-v$VERSION.apk" --repo "$GITHUB_REPOSITORY" --title "SM éducation v$VERSION" --notes "APK build #$GITHUB_RUN_NUMBER. Install it over the current app: your data is kept when the signing key is the same." --latest
